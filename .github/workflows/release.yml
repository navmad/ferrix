name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. v1.18.0); defaults to workspace version"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run host unit tests
        run: ./tools/build.sh test

  build:
    name: Build ${{ matrix.firmware }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: thinknode-m1-companion
            pkg: ferrix-thinknode-m1-companion
            target: thumbv7em-none-eabihf
            uf2_base: "0x26000"
            dfu_dev_type: "0x0052"
            dfu_sd_req: "0x00B6"
          - firmware: wio-tracker-l1-pro-companion
            pkg: ferrix-wio-tracker-l1-pro-companion
            target: thumbv7em-none-eabihf
            uf2_base: "0x27000"
            dfu_dev_type: "0x0052"
            dfu_sd_req: "0x0123"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install adafruit-nrfutil
        run: pip install adafruit-nrfutil

      - name: Resolve firmware version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
            echo "FERRIX_VERSION=$VER" >> "$GITHUB_ENV"
          elif [ "$REF_IS_TAG" = "true" ]; then
            VER="$REF_NAME"
            echo "FERRIX_VERSION=$VER" >> "$GITHUB_ENV"
          else
            VER="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          VER="${VER#v}"
          VER="${VER#V}"
          VER="${VER%-ferrix}"
          echo "RELEASE_TAG=v${VER}" >> "$GITHUB_ENV"
          echo "Resolved release tag: v${VER}"

      - name: Build ${{ matrix.firmware }} UF2 and DFU ZIP
        run: |
          cargo build -p "${{ matrix.pkg }}" --target "${{ matrix.target }}" --release
          python3 tools/check_task_arena.py "target/${{ matrix.target }}/release/ferrix"
          OBJCOPY="$(find "$(rustc --print sysroot)" -name llvm-objcopy | head -n 1)"
          if [ -z "$OBJCOPY" ]; then
            echo "ERROR: llvm-objcopy not found in rust sysroot" >&2
            exit 1
          fi
          mkdir -p dist
          ASSET="ferrix-${{ matrix.firmware }}-${RELEASE_TAG}"
          "$OBJCOPY" -O binary \
            "target/${{ matrix.target }}/release/ferrix" \
            "dist/${ASSET}.bin"
          python3 tools/uf2conv.py \
            "dist/${ASSET}.bin" \
            -o "dist/${ASSET}.uf2" \
            -b "${{ matrix.uf2_base }}"
          "$OBJCOPY" -O ihex \
            "target/${{ matrix.target }}/release/ferrix" \
            "dist/${ASSET}.hex"
          adafruit-nrfutil dfu genpkg \
            --dev-type "${{ matrix.dfu_dev_type }}" \
            --sd-req "${{ matrix.dfu_sd_req }}" \
            --application "dist/${ASSET}.hex" \
            "dist/${ASSET}.zip"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrix-${{ matrix.firmware }}-${{ env.RELEASE_TAG }}
          path: |
            dist/ferrix-${{ matrix.firmware }}-${{ env.RELEASE_TAG }}.uf2
            dist/ferrix-${{ matrix.firmware }}-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.uf2
            artifacts/*.zip
