[package]
name = "ferrix-thinknode-m1"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-40960"] }
embassy-time = { version = "0.4", features = ["defmt", "generic-queue-8"] }
embassy-nrf = { version = "0.3", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "reset-pin-as-gpio", "qspi-multiwrite-flash"] }
embassy-futures = { version = "0.1", features = ["defmt"] }

embedded-hal-bus = { version = "0.2", features = ["async"] }
embedded-io-async = { version = "0.6", features = ["defmt-03"] }
embedded-graphics = "0.8"
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice.git", rev = "5949a5b", features = ["nrf52840", "s140", "ble-peripheral", "ble-gatt-server", "ble-sec", "defmt", "critical-section-impl", "evt-max-size-512"] }

heapless = { version = "0.8", features = ["defmt-03"] }
static_cell = "2.1"

meshcore-wire = { path = "../../crates/meshcore-wire" }
ferrix-core = { path = "../../crates/ferrix-core" }
ferrix-hal = { path = "../../crates/ferrix-hal" }
ferrix-nrf52 = { path = "../../platforms/nrf52" }
ferrix-runtime = { path = "../../crates/ferrix-runtime" }
ferrix-sx1262 = { path = "../../drivers/radio/sx1262" }
ferrix-ssd1681 = { path = "../../drivers/display/ssd1681" }
ferrix-l76k = { path = "../../drivers/gnss/l76k" }
ferrix-role-companion = { path = "../../roles/companion" }
