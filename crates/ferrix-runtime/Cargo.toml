[package]
name = "ferrix-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
ferrix-core = { path = "../ferrix-core" }
ferrix-hal = { path = "../ferrix-hal" }
meshcore-wire = { path = "../meshcore-wire" }
heapless = { version = "0.8", features = ["defmt-03"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embedded-storage-async = "0.4"
embassy-futures = { version = "0.1", features = ["defmt"] }
embassy-time = { version = "0.4", features = ["defmt"] }
defmt = "0.3"
