[package]
name = "meshcore-wire"
version = "0.1.0"
edition = "2021"
description = "MeshCore over-the-air wire protocol, crypto and payload codecs"
publish = false

[dependencies]
heapless = "0.8"
sha2 = { version = "0.10", default-features = false }
aes = "0.8"
curve25519-dalek = { version = "4", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["hazmat"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
futures = "0.3"
sequential-storage = { version = "8", features = ["_test"] }
