[workspace]
resolver = "2"
members = [
    "crates/meshcore-wire",
    "crates/ferrix-hal",
    "crates/ferrix-core",
    "crates/ferrix-runtime",
    "boards/thinknode-m1",
]
default-members = ["boards/thinknode-m1"]

# Local patch: nrf-softdevice panics when a GAP/GATTS event arrives after the
# peer disconnected (e.g. a late CONN_PARAM_UPDATE). See the patch notes in
# vendor/nrf-softdevice/nrf-softdevice/src/ble/connection.rs.
[patch."https://github.com/embassy-rs/nrf-softdevice.git"]
nrf-softdevice = { path = "vendor/nrf-softdevice/nrf-softdevice" }

# Local patch: lora-phy 3.0.1 enables LDRO with a hard-coded SF/bandwidth table
# that is only correct at 125 kHz. The SX126x rule uses the symbol time, so
# SF10-12 at 62.5 kHz did not interoperate. See vendor/lora-phy/PATCHES.md.
[patch.crates-io]
lora-phy = { path = "vendor/lora-phy" }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
lto = "fat"

# Host tests link the std test harness; fat LTO on the dev profile hits the
# macOS object-section limit for the core crate's large static state.
[profile.test]
lto = "off"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
opt-level = "s"
lto = "fat"
