[workspace]
resolver = "2"
members = [".", "crates/meshcore-wire"]
default-members = ["."]

# Local patch: nrf-softdevice panics when a GAP/GATTS event arrives after the
# peer disconnected (e.g. a late CONN_PARAM_UPDATE). See the patch notes in
# vendor/nrf-softdevice/nrf-softdevice/src/ble/connection.rs.
[patch."https://github.com/embassy-rs/nrf-softdevice.git"]
nrf-softdevice = { path = "vendor/nrf-softdevice/nrf-softdevice" }

[package]
name = "ferrix"
version = "0.1.0"
edition = "2021"

[features]
default = ["thinknode-m1"]
thinknode-m1 = []

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-32768"] }
embassy-time = { version = "0.4", features = ["defmt", "generic-queue-8"] }
embassy-nrf = { version = "0.3", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "reset-pin-as-gpio"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-futures = { version = "0.1", features = ["defmt"] }
embassy-usb = { version = "0.4", features = ["defmt"] }

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.2", features = ["async"] }
embedded-io-async = { version = "0.6", features = ["defmt-03"] }
embedded-storage-async = "0.4"
embedded-graphics = "0.8"
lora-phy = "3.0.1"
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice.git", rev = "5949a5b", features = ["nrf52840", "s140", "ble-peripheral", "ble-gatt-server", "ble-sec", "defmt", "critical-section-impl", "evt-max-size-512"] }

heapless = { version = "0.8", features = ["defmt-03"] }
static_cell = "2.1"
nmea = { version = "0.6", default-features = false }

meshcore-wire = { path = "crates/meshcore-wire" }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "s"
lto = "fat"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
opt-level = "s"
lto = "fat"
