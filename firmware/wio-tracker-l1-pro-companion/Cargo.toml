[package]
name = "ferrix-wio-tracker-l1-pro-companion"
version.workspace = true
edition = "2021"
build = "build.rs"

[[bin]]
name = "ferrix"
path = "src/main.rs"

[features]
default = []
internal-storage = ["ferrix-wio-tracker-l1-pro/internal-storage"]

[dependencies]
cortex-m-rt = "0.7"
defmt-rtt = "0.4"
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-40960"] }
ferrix-nrf52 = { path = "../../platforms/nrf52" }
ferrix-role-companion = { path = "../../roles/companion" }
ferrix-wio-tracker-l1-pro = { path = "../../boards/wio-tracker-l1-pro" }
